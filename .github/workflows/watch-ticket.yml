name: MÁV jegy figyelő

# Egy futás kb. 5 és háromnegyed óráig 3 percenként ellenőriz, a végén újraindítja magát.
# A cron csak tartalék, ha a lánc valamiért megszakadna.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      figyeles:
        description: "Mit figyeljen?"
        type: choice
        options:
          - nincs változás
          - vasárnap
          - péntek
          - mindkettő
          - kikapcsolva
        default: nincs változás
      teszt_ertesites:
        description: "Küldjön teszt értesítést"
        type: boolean
        default: false
      debug:
        description: "Részletes log"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Új futás (pl. átállítás) azonnal leállítja az éppen futót.
concurrency:
  group: mav-figyelo
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Figyelés átállítása
        if: github.event_name == 'workflow_dispatch' && inputs.figyeles != 'nincs változás'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FIGYELES: ${{ inputs.figyeles }}
        run: |
          python mav_ticket_watch.py --set-mode "$FIGYELES"
          git add config.json
          git diff --cached --quiet || git commit -m "Figyelés: $FIGYELES"
          git push

      - name: Jegyek figyelése
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          DEBUG: ${{ inputs.debug && '1' || '' }}
          TEST_NOTIFY: ${{ inputs.teszt_ertesites && '1' || '' }}
        run: python mav_ticket_watch.py --loop-minutes 345 --interval 180
