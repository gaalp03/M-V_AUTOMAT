name: MÁV jegy figyelő

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      figyeles:
        description: "Mit figyeljen?"
        type: choice
        options:
          - nincs változás
          - vasárnap
          - péntek
          - mindkettő
          - kikapcsolva
        default: nincs változás
      teszt_ertesites:
        description: "Küldjön teszt értesítést"
        type: boolean
        default: false
      debug:
        description: "Részletes log"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mav-figyelo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: .mav_state.json
          key: mav-state-${{ github.run_id }}
          restore-keys: mav-state-

      - name: Figyelés átállítása
        if: github.event_name == 'workflow_dispatch' && inputs.figyeles != 'nincs változás'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FIGYELES: ${{ inputs.figyeles }}
        run: |
          python mav_ticket_watch.py --set-mode "$FIGYELES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --cached --quiet || git commit -m "Figyelés: $FIGYELES"
          git push

      - name: Jegy ellenőrzése
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG: ${{ inputs.debug && '1' || '' }}
          TEST_NOTIFY: ${{ inputs.teszt_ertesites && '1' || '' }}
        run: python mav_ticket_watch.py
